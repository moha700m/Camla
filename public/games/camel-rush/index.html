<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080e1a" />
    <title>CAMEL RUSH 966</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/games/camel-rush/style.css" />
  </head>
  <body>
    <main id="gameShell" class="game-shell">
      <canvas id="raceCanvas" aria-label="سباق الهجن التفاعلي"></canvas>
      <div class="world-vignette" aria-hidden="true"></div>

      <header class="top-hud">
        <div class="brand-lockup">
          <div class="brand-mark"><span>🐪</span></div>
          <div>
            <p class="eyebrow">SAUDI NIGHT LEAGUE · 966</p>
            <h1>هجن <i>RUSH</i></h1>
          </div>
        </div>
        <div class="live-stack">
          <span id="liveStatus" class="live-pill is-offline"><i></i><span>غير متصل</span></span>
          <span id="viewerCount" class="viewer-count">◉ 0</span>
        </div>
      </header>

      <section class="race-meta" aria-label="معلومات السباق">
        <div class="camel-stat"><span class="meta-label">في المضمار</span><strong><b id="raceNumber">0</b><em>جمل</em></strong></div>
        <div class="hype-meter"><span class="meta-label">طاقة الجمهور</span><div class="hype-track"><span id="hypeFill"></span></div></div>
      </section>

      <section class="join-banner" aria-label="طريقة الدخول">
        <div class="join-icon">＋</div>
        <div><span>FOLLOW = ENTER</span><strong>تابع البث، جملك يدخل باسمك فورًا</strong></div>
        <div class="join-arrow">←</div>
      </section>

      <div id="eventToast" class="event-toast" role="status" aria-live="polite"></div>
      <div id="eventFeed" class="event-feed" aria-live="polite"></div>

      <footer class="bottom-hud">
        <div class="gift-legend">
          <span><b>🌹</b><small>ROSE</small>تسريع</span>
          <span><b>🎁</b><small>GIFT</small>دفعة قوية</span>
          <span><b>👑</b><small>PREMIUM</small>جمل ملكي</span>
        </div>
        <button id="soundToggle" class="sound-toggle" type="button" aria-pressed="false"><span>♪</span> شغّل الصوت</button>
      </footer>

      <aside id="demoControls" class="demo-controls hidden" aria-label="أدوات الاختبار المحلي">
        <div class="demo-title">وضع الاختبار المحلي</div>
        <button data-demo="join">دخول محمد</button>
        <button data-demo="rose">🌹 Rose</button>
        <button data-demo="gift">🎁 Gift</button>
        <button data-demo="rocket">👑 Rocket</button>
        <button data-demo="likes">100 Likes</button>
        <button data-demo="share">Share</button>
      </aside>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/lib/tiktok-bridge.js"></script>
    <script src="/games/camel-rush/audio.js"></script>
    <script src="/games/camel-rush/renderer.js"></script>
    <script src="/games/camel-rush/game.js"></script>
  </body>
</html>
