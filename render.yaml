services:
  - type: web
    name: camel-rush-966
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TIKTOK_UNIQUE_ID
        value: "mgz7o2"
      - key: EULER_API_KEY
        sync: false
